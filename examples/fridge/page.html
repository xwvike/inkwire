<!-- A quiet 400x300 smart-fridge status board. The temperature is the primary
     signal; inventory and the next action stay visible without competing with it. -->
<style>
* { box-sizing: border-box; }

.page { width: 400px; height: 300px; padding: 12px; background: white; color: black;
        font-family: ui; font-size: 12px; }
.board { position: relative; width: 376px; height: 276px; border: 1px solid black;
         border-radius: 8px; background: white; }

.top { height: 54px; padding: 8px 14px; display: flex; align-items: center;
       background: black; color: white; border-bottom: 3px solid red; }
.top .logo { width: 30px; height: 30px; margin-right: 9px; }
.top .name { display: flex; flex-direction: column; justify-content: center; }
.top .eyebrow { font-family: monaco; font-size: 10px; line-height: 12px; color: yellow; }
.top h1 { margin: 0; font-family: hzk; font-size: 16px; line-height: 20px; }
.top .meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end;
             font-family: monaco; font-size: 10px; line-height: 14px; }
.top .meta .ready { color: red; }
.top .meta .ready.cjk { font-family: hzk; font-size: 12px; }

.main { height: 152px; padding: 14px 14px 4px; display: grid; grid-template-columns: 204px 1fr; column-gap: 8px; }
.hero { position: relative; padding-right: 16px; border-right: 1px solid black; }
.hero .kicker { display: flex; align-items: center; gap: 5px; font-family: hzk; font-size: 12px; line-height: 15px; }
.hero .kicker em { font-family: monaco; font-size: 10px; line-height: 12px; color: red; }
.hero .reading { display: flex; align-items: center; margin-top: 6px; }
.hero .reading strong { font-family: monaco; font-size: 48px; line-height: 52px; }
.hero .reading .unit { margin-left: 4px; font-family: monaco; font-size: 16px; line-height: 20px; color: red; }
.hero .reading .unit .cjk { font-family: hzk; font-size: 16px; }
.hero .reading .state { position: relative; top: -1px; margin-left: auto; font-family: hzk; font-size: 12px; line-height: 16px; color: red; }
.hero .scale-wrap { position: relative; width: 180px; height: 28px; margin-top: 8px; }
.hero .scale { width: 180px; height: 28px; }
.hero .scale line { stroke: black; stroke-width: 1px; }
.hero .scale .hot { stroke: red; stroke-width: 3px; }
.hero .scale circle { fill: red; }
.hero .scale-label { position: absolute; top: 16px; font-family: monaco; font-size: 10px; line-height: 12px; }
.hero .scale-zero { left: 0; }
.hero .scale-max { right: 0; }
.hero .metrics { position: absolute; left: 0; right: 16px; bottom: 0; display: grid;
                 grid-template-columns: 1fr 1fr; column-gap: 10px; padding-top: 7px; border-top: 1px solid black; }
.hero .metric { display: flex; flex-direction: column; }
.hero .metric label { font-family: hzk; font-size: 12px; line-height: 15px; }
.hero .metric b { margin-top: 2px; font-family: monaco; font-size: 14px; line-height: 16px; color: red; }

.focus { min-width: 0; padding-left: 0; overflow: hidden; }
.focus .heading { position: relative; display: flex; align-items: center; height: 18px; gap: 6px; }
.focus .heading .bar { width: 4px; height: 14px; background: red; }
.focus h2 { margin: 0; font-family: hzk; font-size: 14px; line-height: 16px; }
.items { margin-top: 6px; border-top: 1px solid black; }
.item { height: 26px; display: grid; grid-template-columns: 1fr 52px; align-items: center; border-bottom: 1px solid black; }
.item .food { font-family: hzk; font-size: 12px; line-height: 15px; }
.item .food i { margin-left: 4px; font-family: monaco; font-size: 10px; line-height: 12px; color: red; }
.item .when { text-align: right; font-family: monaco; font-size: 10px; line-height: 12px; }
.item .when.cjk { font-family: hzk; font-size: 12px; }
.item .when.hot { color: red; }
.focus .note { margin-top: 5px; display: block; font-family: hzk; font-size: 12px; line-height: 15px; }
.focus .note b { display: inline-block; margin-right: 5px; padding: 1px 4px; border: 1px solid black; border-radius: 3px; font-family: monaco; font-size: 10px; line-height: 12px; }

.bottom { height: 68px; margin: 0 14px; padding-top: 8px; display: flex; align-items: flex-start;
          border-top: 1px solid black; }
.bottom .next { flex: 1 1 0px; min-width: 0; display: flex; flex-direction: column; }
.bottom .label { font-family: monaco; font-size: 10px; line-height: 12px; color: red; }
.bottom .next .label { font-family: monaco; font-size: 10px; }
.bottom .next strong { margin-top: 2px; font-family: hzk; font-size: 14px; line-height: 17px; }
.bottom .dish { display: flex; align-items: center; gap: 2px; }
.bottom .next span { font-family: hzk; font-size: 12px; line-height: 15px; }
.bottom .next .when { font-family: monaco; font-size: 10px; line-height: 12px; }
.bottom .sync { flex: 0 0 116px; padding-left: 12px; border-left: 1px solid black; display: flex; flex-direction: column; align-items: flex-end; }
.bottom .sync b { margin-top: 2px; font-family: monaco; font-size: 16px; line-height: 20px; }
.bottom .sync span { font-family: hzk; font-size: 12px; line-height: 15px; }
.bottom .sync .red { color: red; font-family: monaco; font-size: 10px; }
.cjk { font-family: hzk; font-size: 12px; }
</style>

<main class="page">
  <section class="board">
    <header class="top">
      <svg class="logo" viewBox="0 0 30 30"><rect x="3" y="1" width="24" height="28" rx="3" fill="none" stroke="red" stroke-width="2" /><line x1="3" y1="12" x2="27" y2="12" stroke="red" /><line x1="8" y1="5" x2="8" y2="9" stroke="yellow" stroke-width="2" /><line x1="8" y1="16" x2="8" y2="24" stroke="red" stroke-width="2" /></svg>
      <div class="name"><span class="eyebrow">SMART FRIDGE / 04</span><h1>冷藏状态</h1></div>
      <div class="meta"><span class="ready cjk">运行正常</span><span>08.14 THU</span></div>
    </header>

    <div class="main">
      <section class="hero">
        <div class="kicker"><span>冷藏室温度</span><em>LIVE</em></div>
        <div class="reading"><strong>04</strong><span class="unit"><span class="cjk">°</span>C</span><span class="state">稳定</span></div>
        <div class="scale-wrap"><svg class="scale" viewBox="0 0 188 28">
          <line x1="4" y1="11" x2="184" y2="11" />
          <line x1="4" y1="7" x2="4" y2="15" /><line x1="49" y1="8" x2="49" y2="14" />
          <line x1="94" y1="8" x2="94" y2="14" /><line x1="139" y1="8" x2="139" y2="14" /><line x1="184" y1="7" x2="184" y2="15" />
          <line class="hot" x1="4" y1="11" x2="112" y2="11" /><circle cx="112" cy="11" r="4" />
        </svg><span class="scale-label scale-zero">0</span><span class="scale-label scale-max">8C</span></div>
        <div class="metrics"><div class="metric"><label>上次开门</label><b>08:42</b></div><div class="metric"><label>今日开门</label><b>06 <span class="cjk">次</span></b></div></div>
      </section>

      <section class="focus">
        <div class="heading"><i class="bar"></i><h2>优先使用</h2></div>
        <div class="items">
          <div class="item"><span class="food">菠菜<i>1</i><span class="cjk">份</span></span><span class="when hot cjk">今天</span></div>
          <div class="item"><span class="food">牛奶<i>2</i><span class="cjk">盒</span></span><span class="when hot cjk">明天</span></div>
          <div class="item"><span class="food">鸡蛋<i>08</i><span class="cjk">枚</span></span><span class="when cjk">周日</span></div>
        </div>
        <div class="note"><b>TIP</b><span>先用临期食材</span></div>
      </section>
    </div>

    <footer class="bottom">
      <div class="next"><span class="label">NEXT ACTION</span><strong>今日晚餐</strong><div class="dish"><span class="cjk">番茄牛腩</span><span class="when">/19:00</span></div></div>
      <div class="sync"><span>最近同步</span><b>08:45</b><span class="red">ALL SYSTEMS OK</span></div>
    </footer>
  </section>
</main>
