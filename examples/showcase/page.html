<!--
  A page showing the supported drawing primitives, written as Markup.

  It is the sheet that shows every primitive, so it is also the page that says
  whether a stylesheet and an SVG element between them can reach the drawing
  primitives exposed by Markup.
-->

<style>
/* Everything here is placed rather than laid out: it is a sheet of samples and
   no two of them are the same size. The shapes go in SVG elements, which is
   where a page keeps geometry. */

.page {
  display: block;
  position: relative;
  width: 296px;
  height: 128px;
  background: white;
  overflow: hidden;
}

/* The border round the whole sheet, and the bar across the top. */
.frame {
  display: block;
  position: absolute;
  top: 1px; left: 1px; width: 294px; height: 126px;
  border: 1px solid black;
  border-radius: 6px;
}
.bar {
  display: block;
  position: absolute;
  top: 3px; left: 3px; width: 290px; height: 23px;
  background: black;
  border-radius: 5px;
}
.title {
  position: absolute;
  top: 5px; left: 8px; width: 280px; height: 19px;
  font-family: monaco; font-size: 14px; color: white;
  white-space: pre;
}
.title .cn { font-family: ui; }
.title .hot { color: red; }

/* The three panels.

   The rounded border and the clip are two things here: overflow on a rounded
   box rounds the clip, which is what CSS says and what this page wants. */
.panel {
  display: block;
  position: absolute;
  top: 29px;
  overflow: hidden;
}
.shapes { left: 4px;   width: 95px; height: 95px; }
.paths  { left: 101px; width: 97px; height: 95px; }
.type   { left: 200px; width: 92px; height: 95px; }
.type svg { width: 92px; height: 95px; }

.panel h2 {
  position: absolute;
  top: 3px; left: 5px; height: 12px;
  font-family: monaco; font-size: 10px; color: black;
}
.shapes h2 { width: 85px; }
.paths h2  { width: 87px; }
.type h2   { width: 82px; }

.panel svg { display: block; position: absolute; top: 0; left: 0; }
.shapes svg { width: 95px; height: 95px; }
.paths svg  { width: 97px; height: 95px; }

/* The type panel is text, so it is text and not a drawing.

   Each line states its own place. A rule for all of them would be a class and
   an element, which outranks a class on its own — so the shared rule would win
   over the specific ones, which is how CSS works and not what anybody means. */
.t16, .t14, .t12, .t10, .chiptext { position: absolute; color: black; }
.t16 { top: 15px; left: 5px; width: 82px; height: 19px; font-family: hzk; font-size: 16px; }
.t14 { top: 34px; left: 5px; width: 82px; height: 16px; font-family: hzk; font-size: 14px; }
.t12 { top: 50px; left: 5px; width: 83px; height: 15px; font-family: ui; font-size: 12px; }
.t10 { top: 66px; left: 5px; width: 82px; height: 14px; font-family: monaco; font-size: 10px;
       text-align: center; }
.t16 .hot, .t14 .hot, .t12 .hot { color: red; font-family: monaco; }
.t12 .hot { font-size: 12px; }

.chiptext {
  top: 81px; left: 7px; width: 78px; height: 12px;
  font-family: monaco; font-size: 10px; color: white;
  text-align: center;
}
.chiptext .hot { color: red; }
</style>

<div class="page">
  <i class="frame"></i>
  <i class="bar"></i>
  <p class="title">INKWIRE  <span class="cn">图元与文字展示</span><span class="hot">  RBW</span></p>

  <div class="panel shapes">

      <rect x="5" y="25" width="25" height="20" fill="none" stroke="black" stroke-width="1"/>
      <rect x="35" y="25" width="23" height="20" fill="red"/>
      <rect x="63" y="25" width="27" height="20" rx="4" fill="none" stroke="black" stroke-width="2"/>
      <circle cx="14" cy="58" r="7" fill="none" stroke="black" stroke-width="1"/>
      <circle cx="36" cy="58" r="7" fill="red"/>
      <ellipse cx="58.5" cy="57" rx="9.5" ry="10" fill="none" stroke="red" stroke-width="1"/>
      <ellipse cx="83.5" cy="57" rx="9.5" ry="10" fill="black"/>
      <polyline points="5,87 14,78 23,87 32,78 41,87" fill="none" stroke="red" stroke-width="1"/>

      <polygon points="77,94 86,72 94,94" fill="red"/>

  </div>

  <div class="panel paths">
    <h2>PATH / ARC</h2>

      <rect x="0" y="0" width="97" height="95" rx="5" fill="none" stroke="black" stroke-width="1"/>

  <div class="panel type">

      <rect x="4" y="81" width="84" height="12" rx="3" fill="black"/>
    </svg>
    <h2>TYPE / COLOR</h2>
    <p class="t16">中文<span class="hot">16</span></p>
    <p class="t14">图元<span class="hot">14</span></p>
    <p class="t12">中文12 <span class="hot">ABC</span></p>

  </div>
</div>
