<!--
  One page for the layout nodes: a grid, an anchored badge, a relative offset
  inside a transform, and a note cut off where its cell ends.

  Every number here that could be a sum is a sum. The three bars start at the
  same x because one automatic column measures the three labels, not because
  anyone measured them. The badge sits six from the bottom and six from the
  right, which is not an x until the page has been laid out. The turned strip
  is offset by half its own width, written as calc rather than as the 64 that
  would fall out of it.
-->

<style>
.page {
  display: flex;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
  font-family: monaco;
  font-size: 12px;
}

/* The strip -------------------------------------------------------------- */
.strip { flex-basis: 16px; position: relative; background: black; color: white; }
/* A turn does not change what a box takes up, here or in a browser, so the
   label keeps its own 128x16 and is hung by half of each. */
.strip .label {
  position: absolute;
  left: calc(50% - 64px);
  top: calc(50% - 8px);
  width: 128px;
  height: 16px;
  rotate: 270deg;
  text-align: center;
  vertical-align: middle;
}

/* Zero basis so the strip beside it settles the width, not the widest
   thing that happens to be inside. */
.sheet { flex-grow: 1; flex-basis: 0px; display: flex; flex-direction: column; }

header {
  flex-basis: 18px;
  display: flex;
  align-items: center;
  padding: 0 5px;
  background: black;
  color: white;
  vertical-align: middle;
}
header .what { font-family: ui; }
header .when { margin-left: auto; text-align: right; }

/* The readings ----------------------------------------------------------- */
.body { flex-grow: 1; position: relative; padding: 5px 54px 5px 5px; }

/* Three columns: the label, the bar, the figure. The first and the last are
   automatic, which is what makes three readings that know nothing about each
   other line up without any of them saying where. */
.readings {
  /* Fills its box, so the last row is what is left over rather than nothing. */
  height: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-rows: 14px 14px 14px auto;
  column-gap: 5px;
  row-gap: 4px;
}
.readings .bar { border: 1px solid black; padding: 2px; display: flex; }
.readings .bar div { background: black; }
.readings .bar .warm { background: red; }
.readings .figure { text-align: right; }
.readings .hot { color: red; }

/* Longer than its cell on purpose: the page is here to show the cut, and the
   report is here to say it happened. */
.readings .note {
  grid-column: 1 / span 3;
  /* One line that does not fit, rather than two that do: the cut is the point,
     so the note must not be allowed to wrap its way out of it. */
  white-space: nowrap;
  overflow: hidden;
  font-family: ui;
}

/* The badge -------------------------------------------------------------- */
.badge {
  position: absolute;
  right: 6px;
  bottom: 6px;
  width: 42px;
  height: 42px;
  z-index: 1;
  clip-path: circle(50%);
  background: red;
  color: white;
}
/* Twice the strike, which on a panel with no greys is a copy rather than a
   resampling: whole-number scaling moves pixels onto pixels. The scale is on
   the figure and not on the badge, because scaling the badge would scale the
   circle with it. Relative positioning keeps the figure in its flow slot
   while nudging the transformed figure inside the clipped badge. */
.badge b {
  display: block;
  width: 42px;
  height: 42px;
  position: relative;
  top: 2px;
  left: 4px;
  scale: 2;
  text-align: center;
  vertical-align: middle;
}
</style>

<div class="page">
  <div class="strip"><span class="label">LAYOUT SHOWCASE</span></div>

  <div class="sheet">
    <header>
      <span class="what">布局节点</span>
      <span class="when">08-14</span>
    </header>

    <div class="body">
      <div class="readings">
        <span>CPU</span>
        <div class="bar"><div style="width: 62%"></div></div>
        <span class="figure">62%</span>

        <span>MEM</span>
        <div class="bar"><div class="warm" style="width: 88%"></div></div>
        <span class="figure hot">88%</span>

        <span>DISK</span>
        <div class="bar"><div style="width: 35%"></div></div>
        <span class="figure">35%</span>

        <p class="note">内存吃紧，这一行故意写得比格子还长以便被裁掉</p>
      </div>

      <div class="badge"><b>7</b></div>
    </div>
  </div>
</div>
