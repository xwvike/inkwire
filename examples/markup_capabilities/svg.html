<!-- SVG is the geometry vocabulary inside an HTML page. -->
<style>
* { box-sizing: border-box; }
.page { display: flex; flex-direction: column; width: 400px; height: 300px; padding: 8px;
        gap: 6px; background: white; color: black; font-family: ui; font-size: 12px; }
.head { flex: 0 0 24px; display: flex; align-items: center; padding: 0 8px; background: black; color: white; }
.head span { margin-left: auto; color: yellow; }
.sheet { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
         grid-template-rows: 1fr 1fr; gap: 6px; }
.cell { min-width: 0; min-height: 0; padding: 5px; border: 1px solid black; border-radius: 4px; }
.cell h2 { height: 13px; margin: 0; color: red; font-size: 12px; }
.cell svg { display: block; width: 100%; height: 78px; }
.outline { fill: white; stroke: black; stroke-width: 2; }
.accent { fill: red; stroke: black; stroke-width: 1; }
.dash { fill: none; stroke: black; stroke-width: 2; stroke-dasharray: 4 3; }
.small { fill: yellow; stroke: black; }
</style>

<div class="page">
  <div class="head">SVG GEOMETRY <span>shapes / paths / defs</span></div>
  <div class="sheet">
    <section class="cell">
      <h2>PRIMITIVES</h2>
      <svg viewBox="0 0 180 78">
        <rect class="outline" x="2" y="4" width="38" height="25" rx="4"/>
        <circle class="accent" cx="61" cy="16" r="13"/>
        <ellipse class="small" cx="96" cy="17" rx="17" ry="11"/>
        <line x1="122" y1="29" x2="145" y2="4" stroke="black" stroke-width="2"/>
        <polyline class="dash" points="150,28 159,7 173,27"/>
        <polygon class="accent" points="30,68 46,42 62,68"/>
      </svg>
    </section>
    <section class="cell">
      <h2>PATH + TRANSFORM</h2>
      <svg viewBox="0 0 180 78">
        <path class="dash" d="M8 60 C25 18 45 18 62 60 S100 102 117 60"/>
        <g transform="translate(124 12) scale(1)"><rect class="accent" width="44" height="44" rx="8"/></g>
      </svg>
    </section>
    <section class="cell">
      <h2>PATTERN + CLIP PATH</h2>
      <svg viewBox="0 0 180 78">
        <defs><pattern id="checks" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="black"/><rect x="6" y="6" width="6" height="6" fill="black"/></pattern>
          <clipPath id="round"><circle cx="90" cy="39" r="30"/></clipPath></defs>
        <rect x="38" y="9" width="104" height="60" fill="url(#checks)" clip-path="url(#round)"/>
      </svg>
    </section>
    <section class="cell">
      <h2>GROUP + CSS OVERRIDE</h2>
      <svg viewBox="0 0 180 78" class="accent">
        <g stroke="black" stroke-width="2"><rect x="12" y="12" width="42" height="42"/><circle cx="88" cy="33" r="21" fill="white"/><path d="M120 55 L145 12 L170 55 Z"/></g>
      </svg>
    </section>
  </div>
</div>
