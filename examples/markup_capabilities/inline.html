<!-- Inline formatting: wrapping, atomic inline boxes and baseline alignment. -->
<style>
* { box-sizing: border-box; }
.page { display: block; width: 400px; height: 300px; padding: 8px;
        background: white; color: black; font-family: ui; font-size: 12px; }
.head { display: block; height: 24px; padding: 4px 8px; background: black; color: white; }
.head .tag { display: inline-block; padding: 1px 4px; margin-left: 8px;
             border: 1px solid white; border-radius: 3px; color: yellow; }
.section { display: block; margin-top: 6px; padding: 5px 7px;
           border: 1px solid black; border-radius: 4px; }
.section h2 { display: block; height: 14px; margin: 0; color: red; font-size: 12px; }
.copy { display: block; height: 44px; line-height: 16px; }
.copy .accent { color: red; border-bottom: 1px solid red; }
.copy .chip { display: inline-block; padding: 1px 4px; margin: 0 2px;
              border: 1px solid black; border-radius: 3px; vertical-align: middle; }
.copy .raised { position: relative; top: -2px; }
.nowrap { display: block; height: 20px; white-space: nowrap; }
.samples { display: block; height: 43px; white-space: nowrap; }
.samples .top, .samples .middle, .samples .bottom { display: inline-block; width: 78px; height: 22px;
  padding: 2px; margin-right: 5px; border: 1px solid black; background: yellow; }
.samples .top { vertical-align: top; }
.samples .middle { vertical-align: middle; background: red; color: white; }
.samples .bottom { vertical-align: bottom; }
.atom { display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 20px;
        margin-right: 5px; border: 1px solid black; }
.atom.grid { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
.atom.grid i { display: block; width: 28px; height: 8px; background: black; }
.pre { display: block; height: 27px; margin-top: 4px; padding: 2px 4px;
       border-left: 3px solid red; white-space: pre; font-family: monaco; font-size: 10px; }
</style>

<div class="page">
  <div class="head">INLINE FORMATTING <span class="tag">inline-block</span> <span class="tag">flow</span></div>
  <section class="section">
    <h2>INLINE FLOW AND WRAPPING</h2>
    <p class="copy">Inline <span class="accent">styled text</span> and <span class="chip">atomic boxes</span> share a line.<br>Wrapping follows the available width.</p>
    <div class="nowrap"><span class="atom">inline-flex</span><span class="atom grid"><i></i><i></i></span> baseline-aligned controls</div>
  </section>
  <section class="section">
    <h2>VERTICAL ALIGNMENT</h2>
    <div class="samples"><span class="top">top</span><span class="middle">middle</span><span class="bottom">bottom</span><span class="raised">relative</span></div>
    <div class="pre">white-space: pre    preserves spaces</div>
  </section>
</div>
