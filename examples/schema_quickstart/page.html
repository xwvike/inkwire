<!--
  The quickstart, written as markup. It renders identically to page.json,
  which is what makes the two formats interchangeable rather than merely
  similar.
-->

<style>
.page {
  display: block;
  width: 296px;
  height: 128px;
  background: white;
  overflow: hidden;
}

header {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 288px;
  height: 24px;
  background: black;
  border-radius: 4px;
  padding: 4px 6px;
  white-space: pre;
}
header b { font-family: monaco; font-size: 12px; color: white; }
header .temp { font-family: ui; font-size: 14px; color: red; }

.body {
  position: absolute;
  top: 42px;
  left: 12px;
  width: 272px;
  height: 72px;
  font-family: ui;
  font-size: 14px;
  line-height: 16px;
  /* This paragraph is intentionally anchored at the top of its tall box. */
  vertical-align: top;
}
</style>

<div class="page">
  <header><b>INKWIRE </b><span class="temp">23.5℃</span></header>
  <p class="body">今天的电子纸页面由 JSON 直接生成。</p>
</div>
