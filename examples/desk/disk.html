<!--
  The same page as disk.html, laid out on a grid instead of four rows.

  The rows there cannot agree on how wide the label column should be, so
  disk.css states it: fifty pixels, chosen by measuring the longest name and
  adding a little. A grid measures that column once, across every row, and the
  number disappears from the stylesheet along with the need to revisit it when
  a longer mount point turns up.
-->

<style>
.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
}

header {
  vertical-align: middle;
  flex-basis: 18px;
  display: flex;
  align-items: center;
  padding: 0 5px;
  background: black;
  color: white;
  font-family: ui;
  font-size: 12px;
}
header .mono {
  margin-left: auto;
  font-family: monaco;
}

/* Three columns: the names as wide as the widest of them, the bars taking
   what is left, the figures as wide as the longest pair. Nothing here states
   a pixel width, and nothing needs revisiting when the contents change. */
main {
  flex-grow: 1;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-rows: repeat(4, 15px) 1fr;
  row-gap: 3px;
  column-gap: 5px;
  padding: 3px 4px;
  align-items: center;
}

.name {
  font-family: monaco;
  font-size: 12px;
  vertical-align: middle;
}

.bar {
  align-self: stretch;
  border: 1px solid black;
  padding: 2px;
}
.bar > i {
  display: block;
  height: 100%;
  background: black;
}

.figs {
  text-align: right;
  font-family: monaco;
  font-size: 12px;
  vertical-align: middle;
}
/* The total is the smaller half of the pair, so the used figure reads first. */
.figs small { font-size: 10px; }

footer {
  grid-column: 1 / 4;
  align-self: end;
  font-family: ui;
  font-size: 12px;
}

.hot { color: red; }
i.hot { background: red; }
</style>

<div class="page">
  <header>
    <span>磁盘</span>
    <span class="mono">08-13 09:42</span>
  </header>

  <main>
    <span class="name">/</span>
    <span class="bar"><i class="hot" style="width: 87.3%"></i></span>
    <span class="figs"><b class="hot">402</b><small>/460G</small></span>

    <span class="name">/data</span>
    <span class="bar"><i style="width: 31.7%"></i></span>
    <span class="figs"><b>1180</b><small>/3720G</small></span>

    <span class="name">/backup</span>
    <span class="bar"><i style="width: 34.4%"></i></span>
    <span class="figs"><b>640</b><small>/1860G</small></span>

    <span class="name">/media</span>
    <span class="bar"><i class="hot" style="width: 87.6%"></i></span>
    <span class="figs"><b class="hot">3260</b><small>/3720G</small></span>

    <footer>2 个卷超过 85%，<span class="hot">/ 还剩 58G</span></footer>
  </main>
</div>
