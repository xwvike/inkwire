<style>
/* Every box measured the way a web page measures one. */
* { box-sizing: border-box; }

.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
}

header {
  flex-basis: 18px;
  display: flex;
  align-items: center;
  padding: 0 5px;
  background: black;
  color: white;
  font-family: ui;
  font-size: 12px;
}
header .mono {
  margin-left: auto;
  font-family: monaco;
  text-align: right;
}

main {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 3px 4px;
  font-family: ui;
  font-size: 12px;
}

.quote {
  flex-grow: 1;
  display: flex;
}

/* The whole reason the strikes are offered at whole-number multiples. */
.price {
  /* Taller than its letters, so the item is centred on its line. */
  align-self: center;
  flex-grow: 1;
  font-family: monaco;
  font-size: 48px;
  color: red;
}
.price small { font-size: 16px; }

.side {
  flex-basis: 96px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.badge {
  /* A filled chip keeps its height and centres what is in it, which is
     what a flex container does for its own contents. */
  display: flex;
  align-items: center;
  justify-content: center;
  flex-basis: 20px;
  background: red;
  border-radius: 2px;
  color: white;
  text-align: center;
  font-family: monaco;
  font-size: 14px;
}

.range {
  flex-basis: 15px;
  text-align: right;
}
.range b { font-family: monaco; }

hr {
  flex-basis: 1px;
  background: black;
}

.holding {
  flex-basis: 15px;
  display: flex;
  align-items: center;
}
.holding .left { flex-grow: 1; }
.holding .left b { font-family: monaco; }
.holding .right {
  flex-grow: 1;
  text-align: right;
}
.holding .right b { font-family: monaco; }
.hot { color: red; }
</style>

<div class="page">
  <header>
    <span>BTC / USD</span>
    <span class="mono">09:42:15</span>
  </header>

  <main>
    <div class="quote">
      <span class="price"><small>$</small>94,318</span>
      <span class="side">
        <span class="badge">+2.41%</span>
        <span class="range">24h 高 <b>95,102</b></span>
        <span class="range">24h 低 <b>91,760</b></span>
      </span>
    </div>

    <hr>

    <div class="holding">
      <span class="left">持仓 <b>0.0428 BTC</b></span>
      <span class="right"><b>$4,036</b>&#12288;今日 <b class="hot">+$95</b></span>
    </div>
  </main>
</div>
