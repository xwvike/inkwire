<!--
  The one desk page that could not be written as markup, written as markup.

  A stylesheet has no way to ask for a polyline of ninety-six points, and it
  should not: the points are not something anyone writes by hand, they are
  what a generator produced from a series. So the page keeps the layout and
  the scene element hands the drawing over, which is the division that was
  there from the start and now has something to say it with.
-->
<div class="page">
  <header>
    <span>AAPL 分时</span>
    <span class="right">08-13 收盘</span>
  </header>

  <main>
    <div class="plot">
      <div class="frame"><scene src="chart-plot.json"></scene></div>
      <div class="axis"><span>09:30</span><span class="mid">12:00</span><span class="end">16:00</span></div>
    </div>

    <div class="quote">
      <b class="last">181.37</b>
      <b class="delta">+8.52</b>
      <b class="delta">+4.93%</b>
      <span class="fill"></span>
      <span class="range">高 <b>182.48</b></span>
      <span class="range">低 <b>172.84</b></span>
    </div>
  </main>
</div>
