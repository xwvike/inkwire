<!--
  The one desk page that could not be written as markup, written as markup.

  A stylesheet has no way to ask for a polyline of ninety-six points, and it
  should not: the points are not something anyone writes by hand, they are
  what a generator produced from a series. So the page keeps the layout and
  an img naming an svg hands the drawing over, which is the division that was
  there from the start and now has standard tags to say it with.
-->

<style>
/* Every box measured the way a web page measures one. */
* { box-sizing: border-box; }

.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
  font-family: ui;
  font-size: 12px;
}

header {
  flex-basis: 18px;
  display: flex;
  align-items: center;
  padding: 0 5px;
  background: black;
  color: white;
}
header .right { margin-left: auto; text-align: right; }

/* The quote column sits against the plot rather than beside it: the frame has
   a border and two pixels of padding already, and a gap on top of that reads
   as the column having drifted loose. */
main {
  flex-grow: 1;
  display: flex;
  padding: 4px 4px 3px 4px;
}

.plot {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.frame {
  flex-grow: 1;
  border: 1px solid black;
  padding: 2px;
}
/* The drawing fills the frame; what it draws inside is its own business. */
.frame img { display: block; width: 100%; height: 100%; }

.axis {
  flex-basis: 11px;
  display: flex;
  font-family: monaco;
  font-size: 10px;
}
.axis span { flex-grow: 1; }
.axis .mid { text-align: center; }
.axis .end { text-align: right; }

.quote {
  flex-basis: 64px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  text-align: right;
}
.quote b { font-family: monaco; }
.last { flex-basis: 20px; font-size: 16px; color: red; line-height: 20px; }
.delta { flex-basis: 13px; font-size: 12px; color: red; }
.fill { flex-grow: 1; }
.range { flex-basis: 13px; font-size: 12px; }
.range b { font-size: 10px; }
</style>

<div class="page">
  <header>
    <span>AAPL 分时</span>
    <span class="right">08-13 收盘</span>
  </header>

  <main>
    <div class="plot">
      <div class="frame"><img src="chart-plot.svg"></div>
      <div class="axis"><span>09:30</span><span class="mid">12:00</span><span class="end">16:00</span></div>
    </div>

    <div class="quote">
      <b class="last">181.37</b>
      <b class="delta">+8.52</b>
      <b class="delta">+4.93%</b>
      <span class="fill"></span>
      <span class="range">高 <b>182.48</b></span>
      <span class="range">低 <b>172.84</b></span>
    </div>
  </main>
</div>
