<!--
  Three panels, one per thing the compiler does: a photo that has to be turned
  into two inks, a drawing whose shapes overlap in a stated order, and every
  primitive at the smallest size it is still legible at.

  The photo is the only one that is not geometry. It is clipped by CSS rather
  than drawn round, because a round picture is a square picture with a shape
  over it and that is what clip-path says.
-->

<style>
/* Every box measured the way a web page measures one. */
* { box-sizing: border-box; }

.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
  font-family: monaco;
  font-size: 10px;
}

header {
  flex-basis: 20px;
  padding: 2px 7px;
  border-radius: 4px;
  background: black;
  color: white;
  font-size: 12px;
}
header .part { color: red; }

.panels { flex-basis: 102px; margin-top: 4px; display: flex; gap: 4px; padding: 0 4px; }
.panel { border: 1px solid black; border-radius: 4px; }
.cjk { font-family: hzk; font-size: 12px; color: red; }

/* The picture ---------------------------------------------------------- */
.photo { flex-basis: 74px; padding: 4px 4px 0; }
.photo .portrait { position: relative; width: 64px; height: 64px; }
.photo img { width: 64px; height: 64px; object-fit: cover; clip-path: circle(50%); }
.photo .rim { position: absolute; top: 0; left: 0; }
.photo figcaption { margin-top: 5px; height: 14px; }
.photo .how { margin: 1px 0 0 2px; height: 12px; }

/* The drawing ---------------------------------------------------------- */
.list { flex-basis: 124px; display: flex; flex-direction: column; padding: 2px 3px 0; }
/* Two spaces before the CJK, and pre is what keeps the second one. */
.list h2 { flex-basis: 13px; white-space: pre; }
.list .plot { flex-basis: 57px; margin-top: 2px; }
.list .readings { flex-basis: 20px; margin-top: 2px; display: flex; gap: 2px; align-items: center; }
.list .readings span { height: 14px; }
.list .amount { flex-basis: 42px; }
.list .temp { flex-basis: 70px; color: red; }

/* The shapes ----------------------------------------------------------- */
.shapes { flex-basis: 82px; position: relative; }
.shapes .heading { position: absolute; top: 4px; left: 5px; width: 72px; }
.shapes svg { position: absolute; top: 0; left: 0; }
</style>

<div class="page">
  <header>INKWIRE <span class="part">COMPOSE</span> / 296x128</header>

  <div class="panels">
    <figure class="panel photo">
      <div class="portrait">
        <img src="portrait.png">
        <svg class="rim" width="64" height="64">
          <circle cx="32" cy="32" r="32" fill="none" stroke="red" stroke-width="1"/>
        </svg>
      </div>
      <figcaption>PHOTO/<span class="cjk">人像</span></figcaption>
      <p class="how">AUTO IMAGE</p>
    </figure>

    <section class="panel list">
      <h2>DISPLAY LIST  <span class="cjk">图形</span></h2>

      <svg class="plot" width="116" height="57">
        <defs>
          <!-- One pixel in sixteen: the lightest grey two inks can make. -->
          <pattern id="screen" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1" height="1" fill="black"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="116" height="57" rx="3" fill="white" stroke="black" stroke-width="1"/>
        <rect x="0" y="0" width="116" height="57" fill="url(#screen)"/>
        <path d="M 5 41 C 20 10 30 61 45 31 Q 58 9 73 34 C 88 58 97 15 111 27"
              fill="none" stroke="black" stroke-width="1" stroke-dasharray="4 2"/>
        <path d="M 6 55 L 21 35 L 34 50 Q 48 24 61 49 L 75 34 L 91 55 Z" fill="black"/>
        <circle cx="101" cy="15" r="7" fill="red" stroke="red" stroke-width="1"/>
      </svg>

      <div class="readings">
        <span class="amount">R 87%</span>
        <span class="temp">TEMP 23.5</span>
      </div>

      <svg width="116" height="4">
        <defs>
          <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1" height="1" fill="red"/>
            <rect x="2" y="1" width="1" height="1" fill="red"/>
            <rect x="1" y="3" width="1" height="1" fill="red"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="116" height="4" fill="url(#weave)"/>
      </svg>
    </section>

    <section class="panel shapes">
      <div class="heading">
        <p>PRIMITIVES</p>
        <p><span class="cjk">图元</span><span class="part"> / COLOR</span></p>
      </div>

      <svg width="82" height="102">
        <!-- Arc, sector and segment, all three spelled with A. -->
        <path d="M 26.0157 50.9371 A 10.5 10.5 0 1 1 23.9246 39.0754" fill="none" stroke="red" stroke-width="2"/>
        <path d="M 41 47 L 41 37 A 10 10 0 0 1 49.6603 52 Z" fill="red"/>
        <path d="M 74.3969 50.4202 A 10 10 0 1 1 60 38.3397 Z" fill="black"/>

        <ellipse cx="17.5" cy="72.5" rx="10.5" ry="7.5" fill="none" stroke="black" stroke-width="3"/>
        <polygon points="44,65 54,73 44,81 34,73" fill="red"/>
        <rect x="64" y="69" width="1" height="1" fill="black"/>

        <line x1="6" y1="97" x2="76" y2="85" stroke="red" stroke-width="2" stroke-dasharray="3 2"/>
        <rect x="8" y="87" width="16" height="9" fill="black" stroke="red" stroke-width="1"/>
        <polyline points="50,94 56,88 62,94 68,89 74,94" fill="none" stroke="black" stroke-width="1"/>
      </svg>
    </section>
  </div>
</div>
