<!-- opencode 的 wordmark。原图三档色：base（open）、strong（code）、weak（字腔）。
     墨水屏上 base 白、strong 红，weak 删掉，露出顶栏的黑底。坐标全是 6 的倍数
     （39x7 的像素格），按 2 或 3 的整数倍缩放时每格都落在整数像素上。
     fill 必须是面板墨色，不是墨色的颜色一笔都不画。 -->
