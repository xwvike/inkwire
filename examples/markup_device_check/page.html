<style>
/* Every box measured the way a web page measures one. */
* { box-sizing: border-box; }

.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  overflow: hidden;
  background: white;
  color: black;
  font-family: monaco;
  font-size: 10px;
}

header {
  flex-basis: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  background: black;
  color: white;
}

header .mark { color: red; }

.content {
  /* Zero basis so the bars above and below settle the height, not the tallest
     thing that happens to be inside. */
  flex-grow: 1;
  flex-basis: 0px;
  display: flex;
  gap: 6px;
  padding: 4px 6px;
}

.copy {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 5px 7px;
  border: 1px solid black;
  border-radius: 4px;
  flex-basis: 140px;
  flex-grow: 0;
  min-width: 0;
}

.copy h1 {
  margin: 0;
  font-size: 14px;
  line-height: 16px;
}

.copy p {
  margin: 3px 0 0;
  line-height: 12px;
}

.badge {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 64px;
  height: 14px;
  padding: 1px 3px;
  border-radius: 3px;
  background: red;
  color: white;
  font-size: 10px;
  line-height: 14px;
}

.visual {
  position: relative;
  flex-basis: 116px;
  height: 78px;
  margin: 0;
  border: 1px solid black;
  border-radius: 4px;
  overflow: hidden;
}

.visual img {
  display: block;
  width: 100%;
  height: 100%;
}

.visual figcaption {
  position: absolute;
  right: 4px;
  bottom: 3px;
  width: 76px;
  height: 14px;
  padding: 1px 2px;
  background: white;
  color: black;
  line-height: 14px;
}

footer {
  flex-basis: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
}

footer .ready { color: red; }
</style>

<div class="page">
  <header>
    <span>INKWIRE <span class="mark">MARKUP</span></span>
    <span>LIVE / 296x128</span>
  </header>

  <main class="content">
    <section class="copy">
      <span class="badge">CSS + SVG</span>
      <h1>DEVICE CHECK</h1>
      <p>Relative + flex,<br>centered text.</p>
      <p>One frame,<br>two inks.</p>
    </section>

    <figure class="visual">
      <img src="assets/plot.svg">
      <figcaption>external svg</figcaption>
    </figure>
  </main>

  <footer>
    <span>HTML -&gt; SCENE -&gt; EPD</span>
    <span class="ready">READY</span>
  </footer>
</div>
