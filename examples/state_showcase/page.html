<!--
  Four boxes about how a page is put together rather than about anything on it.

  The first one is the point: twenty stripes drawn from well outside the box to
  well outside the other side, and an svg element clips them to its viewport
  the way every other clip on the page works. The white band across the middle
  covers what survived, so what is left is only ever the part outside it.
-->

<style>
.page {
  display: flex;
  flex-direction: column;
  width: 296px;
  height: 128px;
  background: white;
  color: black;
  font-family: monaco;
  vertical-align: middle;
}

header, footer { background: black; color: white; }
header { flex-basis: 21px; display: flex; align-items: center; padding: 0 5px; font-size: 14px; }
header .cjk { font-family: hzk; }
header .built { margin-left: auto; font-size: 10px; color: red; }

.path { flex-basis: 13px; margin: 2px 0 2px 5px; font-size: 10px; }

.panels { flex-basis: 67px; display: flex; gap: 3px; padding: 0 3px; }

/* A panel is a stack, and a stack in CSS is what position does. The frame,
   the title strip and the drawing are separate layers on purpose: the stripes
   have to cross the strip below them and pass under the label above. */
.panel { position: relative; }
.panel svg { position: absolute; top: 0; left: 0; }
.panel h2 {
  position: absolute;
  top: 2px; left: 4px; right: 4px;
  height: 12px;
  color: white;
  font-size: 10px;
  text-align: center;
}
.panel .note { position: absolute; left: 8px; font-size: 10px; }

.clip { flex-basis: 95px; }
.clip .cut {
  position: absolute;
  top: 50px; left: 6px; right: 6px;
  height: 11px;
  padding-left: 3px;
  background: black;
  color: white;
  font-size: 10px;
}

.line-up { flex-basis: 97px; }
/* The one panel that is laid out rather than drawn. */
.line-up .row {
  position: absolute;
  top: 22px; left: 8px;
  width: 81px; height: 22px;
  display: flex;
  /* Three 22px boxes and two gaps is the 81 the panel is: the label says the
     number, so the number is what the gap has to be. */
  gap: 7px;
  align-items: center;
}
.line-up .row div { flex-basis: 22px; height: 20px; border: 1px solid black; border-radius: 3px; }
.line-up .row .odd { border-color: red; }
.line-up .note { top: 49px; }

.order { flex-basis: 92px; }
.order .note { top: 53px; }

footer {
  flex-basis: 20px;
  margin-top: 3px;
  padding: 0 5px;
  font-size: 12px;
  text-align: center;
}
footer .op { color: red; }
</style>

<div class="page">
  <header>
    DISPLAY LIST / <span class="cjk">状态栈</span>
    <span class="built">COMPOSE</span>
  </header>

  <p class="path">ABSOLUTE &gt; STACK &gt; CLIP</p>

  <div class="panels">
    <section class="panel clip">
      <svg width="95" height="67">
        <rect x="0" y="0" width="95" height="67" rx="4" fill="none" stroke="black" stroke-width="1"/>
        <rect x="4" y="2" width="87" height="12" fill="black"/>
        <line x1="-32" y1="66" x2="20" y2="13" stroke="red" stroke-width="2"/>
        <line x1="-24" y1="66" x2="28" y2="13" stroke="black" stroke-width="2"/>
        <line x1="-16" y1="66" x2="36" y2="13" stroke="black" stroke-width="2"/>
        <line x1="-8" y1="66" x2="44" y2="13" stroke="red" stroke-width="2"/>
        <line x1="0" y1="66" x2="52" y2="13" stroke="black" stroke-width="2"/>
        <line x1="8" y1="66" x2="60" y2="13" stroke="black" stroke-width="2"/>
        <line x1="16" y1="66" x2="68" y2="13" stroke="red" stroke-width="2"/>
        <line x1="24" y1="66" x2="76" y2="13" stroke="black" stroke-width="2"/>
        <line x1="32" y1="66" x2="84" y2="13" stroke="black" stroke-width="2"/>
        <line x1="40" y1="66" x2="92" y2="13" stroke="red" stroke-width="2"/>
        <line x1="48" y1="66" x2="100" y2="13" stroke="black" stroke-width="2"/>
        <line x1="56" y1="66" x2="108" y2="13" stroke="black" stroke-width="2"/>
        <line x1="64" y1="66" x2="116" y2="13" stroke="red" stroke-width="2"/>
        <line x1="72" y1="66" x2="124" y2="13" stroke="black" stroke-width="2"/>
        <line x1="80" y1="66" x2="132" y2="13" stroke="black" stroke-width="2"/>
        <line x1="88" y1="66" x2="140" y2="13" stroke="red" stroke-width="2"/>
        <line x1="96" y1="66" x2="148" y2="13" stroke="black" stroke-width="2"/>
        <line x1="104" y1="66" x2="156" y2="13" stroke="black" stroke-width="2"/>
        <line x1="112" y1="66" x2="164" y2="13" stroke="red" stroke-width="2"/>
        <line x1="120" y1="66" x2="172" y2="13" stroke="black" stroke-width="2"/>
        <rect x="6" y="20" width="83" height="41" fill="white"/>
      </svg>
      <h2>CLIP RECT</h2>
      <b class="cut">OUTSIDE CUT</b>
    </section>

    <section class="panel line-up">
      <svg width="97" height="67">
        <rect x="0" y="0" width="97" height="67" rx="4" fill="none" stroke="black" stroke-width="1"/>
        <rect x="4" y="2" width="89" height="12" fill="black"/>
      </svg>
      <h2>ROW / COLUMN</h2>
      <div class="row"><div></div><div class="odd"></div><div></div></div>
      <span class="note">GAP 7px</span>
    </section>

    <section class="panel order">
      <svg width="92" height="67">
        <rect x="0" y="0" width="92" height="67" rx="4" fill="none" stroke="black" stroke-width="1"/>
        <rect x="4" y="2" width="84" height="12" fill="black"/>
        <rect x="8" y="20" width="21" height="15" rx="2" fill="none" stroke="black" stroke-width="1"/>
        <rect x="22" y="27" width="21" height="15" rx="2" fill="red"/>
        <rect x="36" y="34" width="21" height="15" rx="2" fill="none" stroke="black" stroke-width="1"/>
        <polygon points="72,21 83,34 72,47 61,34" fill="black"/>
      </svg>
      <h2>STACK ORDER</h2>
      <span class="note">LATER ON TOP</span>
    </section>
  </div>

  <footer>ABSOLUTE<span class="op"> &gt; CLIP &gt; </span>ROW / COLUMN<span class="op"> &gt; STACK</span></footer>
</div>
