<!--
  A page showing clipping, patterns and dashes, written as Markup.

  The patterns are svg patterns, which is the standard way to say one, and the
  clips are the two kinds CSS has: overflow, which follows the corners of the
  box, and clip-path, which is a shape of its own.
-->

<style>
/* This is the sheet about painting rather than shapes: what a clip does, what
   a pattern does, and what a dash does as a line tilts. */

.page { display: block; position: relative; width: 296px; height: 128px;
        background: white; overflow: hidden; }

.bar { display: block; position: absolute; top: 0; left: 0; width: 296px; height: 19px;
       background: black; }
.title { position: absolute; top: 2px; left: 5px; width: 286px; height: 16px;
         font-family: monaco; font-size: 12px; color: white; white-space: pre; }
.title .cn  { font-family: hzk; }
.title .hot { color: red; }

/* Two columns, the left one running the whole height. */
.grid {
  display: grid;
  position: absolute;
  top: 22px; left: 3px; width: 290px; height: 104px;
  grid-template-columns: 143px 144px;
  grid-template-rows: 51px 50px;
  column-gap: 3px;
  row-gap: 3px;
}
.tall { grid-column: 1; grid-row: 1 / 3; }

/* Each cell is a box that clips, with a rounded outline drawn inside it. */
.cell { display: block; position: relative; overflow: hidden; }
.cell svg { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.cell h2 { position: absolute; top: 3px; left: 6px; height: 13px;
           font-family: monaco; font-size: 10px; color: black; }
.tall h2 { width: 131px; }
.pat h2  { width: 132px; }
.dash h2 { width: 132px; }

/* A picture with its corners rounded off, which is what overflow does to a
   rounded box — the one place on this page where that is wanted. */
.photo {
  position: absolute;
  top: 20px; left: 7px; width: 129px; height: 76px;
  border-radius: 12px;
  overflow: hidden;
}
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ring {
  display: block; position: absolute;
  top: 20px; left: 7px; width: 129px; height: 76px;
  border: 1px solid red; border-radius: 12px;
}

/* The three patterned swatches. */
.swatch { display: block; position: absolute; top: 18px; height: 26px; }
.s1 { left: 6px;  width: 39px; }
.s2 { left: 49px; width: 39px; }
.s3 { left: 92px; width: 26px; }
</style>

<div class="page">
  <i class="bar"></i>
  <p class="title">CLIP <span class="cn">裁剪</span><span class="hot">  PATTERN <span class="cn">图案</span></span>  DASH <span class="cn">虚线</span></p>

  <div class="grid">
    <div class="cell tall">
      <svg width="143" height="104">
        <rect x="0" y="0" width="143" height="104" rx="4" fill="none" stroke="black" stroke-width="1"/>
      </svg>
      <h2>CLIP PATH + IMAGE</h2>
      <div class="photo"><img src="synthetic_photo.png"></div>
      <i class="ring"></i>
    </div>

    <div class="cell pat">
      <svg width="144" height="51">
        <defs>
          <pattern id="p2" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1" height="1" fill="black"/>
            <rect x="1" y="1" width="1" height="1" fill="black"/>
          </pattern>
          <pattern id="p4" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1" height="1" fill="black"/>
            <rect x="1" y="1" width="1" height="1" fill="black"/>
            <rect x="2" y="2" width="1" height="1" fill="black"/>
            <rect x="3" y="3" width="1" height="1" fill="black"/>
          </pattern>
          <pattern id="p3" width="3" height="3" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1" height="1" fill="red"/>
            <rect x="1" y="2" width="1" height="1" fill="red"/>
          </pattern>
          <clipPath id="round"><ellipse cx="105" cy="31" rx="12.5" ry="12.5"/></clipPath>
        </defs>
        <rect x="0" y="0" width="144" height="51" rx="4" fill="none" stroke="black" stroke-width="1"/>
        <rect x="6" y="18" width="39" height="26" fill="url(#p2)"/>
        <rect x="6" y="18" width="39" height="26" fill="none" stroke="black" stroke-width="1"/>
        <rect x="49" y="18" width="39" height="26" fill="url(#p4)"/>
        <rect x="49" y="18" width="39" height="26" fill="none" stroke="black" stroke-width="1"/>
        <rect x="92" y="18" width="26" height="26" fill="url(#p3)" clip-path="url(#round)"/>
        <ellipse cx="104.5" cy="30.5" rx="12.5" ry="12.5" fill="none" stroke="black" stroke-width="1"/>
      </svg>
      <h2>PATTERN + CLIP</h2>
    </div>

    <div class="cell dash">
      <svg width="144" height="50">
        <rect x="0" y="0" width="144" height="50" rx="4" fill="none" stroke="black" stroke-width="1"/>
        <line x1="8"   y1="42" x2="34"  y2="42" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="36"  y1="42" x2="60"  y2="32" stroke="red"   stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="64"  y1="42" x2="82"  y2="24" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="92"  y1="42" x2="102" y2="18" stroke="red"   stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="120" y1="42" x2="120" y2="16" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      <h2>DASH AT ANY ANGLE</h2>
    </div>
  </div>
</div>
