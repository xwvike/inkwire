<!--
  Every strike this build carries, at the size it is drawn, so a page that
  needs to choose one can be read against rather than guessed at.
-->

<style>
/* The scene document places every line at an explicit rectangle, so this does
   too: position: absolute with the same tops. The lines are not evenly spaced,
   because each is as tall as the largest strike on it and the gaps between
   them were chosen by eye. */

.page {
  display: block;
  width: 296px;
  height: 128px;
  background: white;
}

p {
  /* The columns on this page are lined up with runs of spaces, so the
     source spacing has to survive. */
  white-space: pre;
  position: absolute;
  left: 6px;
  width: 284px;
}
p:nth-of-type(1) { top: 3px;   height: 16px; }
p:nth-of-type(2) { top: 22px;  height: 16px; }
p:nth-of-type(3) { top: 40px;  height: 17px; }
p:nth-of-type(4) { top: 59px;  height: 18px; }
p:nth-of-type(5) { top: 80px;  height: 14px; }
p:nth-of-type(6) { top: 96px;  height: 15px; }
p:nth-of-type(7) { top: 113px; height: 14px; }

b {
  font-family: monaco;
  font-size: 10px;
  color: red;
}
p:nth-of-type(1) b { color: black; }

.cn     { font-family: hzk;    font-size: 12px; color: red; }
.ui12   { font-family: ui;     font-size: 12px; }
.ui14   { font-family: ui;     font-size: 14px; }
.num14  { font-family: monaco; font-size: 14px; color: red; }
.ui16   { font-family: ui;     font-size: 16px; }
.hzk12  { font-family: hzk;    font-size: 12px; }
.hzk14  { font-family: hzk;    font-size: 14px; }
.ok     { font-family: monaco; font-size: 12px; color: red; }
.mono10 { font-family: monaco; font-size: 10px; }
</style>

<div class="page">
  <p><b>TEXT SHOWCASE / </b><span class="cn">纯文本效果</span></p>
  <p><b>ui 12  </b><span class="ui12">中英文混排  English  0123456789</span></p>
  <p><b>ui 14  </b><span class="ui14">温度 </span><span class="num14">23.5 C</span><span class="ui14">  电量 82%</span></p>
  <p><b>ui 16  </b><span class="ui16">中文字体与 English</span></p>
  <p><b>hzk 12  </b><span class="hzk12">中文点阵：你好世界，天气晴朗。</span></p>
  <p><b>hzk 14  </b><span class="hzk14">十四像素中文显示</span><span class="ok">  OK</span></p>
  <p><span class="mono10">monaco 10 / 12 / 14 / 16   The quick brown fox</span></p>
</div>
