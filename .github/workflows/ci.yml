name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # The release builds five targets, two of them needing a C toolchain for
  # CoreBluetooth. Finding out at tag time that one of them no longer compiles
  # is finding out too late, so every target is built on every change.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0"}
          - {os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0"}
          - {os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0"}
          - {os: macos-14, goos: darwin, goarch: arm64, cgo: "1"}
          - {os: macos-14, goos: darwin, goarch: amd64, cgo: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ./...
